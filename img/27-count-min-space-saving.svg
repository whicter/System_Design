<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 560" font-family="-apple-system, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#444"/></marker>
  </defs>
  <style>
    .box{fill:#EAF1FD;stroke:#3B6FD8;stroke-width:1.5}
    .ok{fill:#EAF7EE;stroke:#2E8B57;stroke-width:1.5}
    .bad{fill:#FDECEA;stroke:#D0392B;stroke-width:1.5}
    .cell{fill:#fff;stroke:#bbb}
    .hit{fill:#FFE7C2;stroke:#E08A00;stroke-width:1.5}
    .b{font-size:13px;fill:#1f2328;font-weight:600}
    .s{font-size:11.5px;fill:#555}
    .m{font-size:11.5px;fill:#1f2328;font-family:Menlo, monospace}
    .h{font-size:14px;font-weight:600;fill:#1f2328}
    .arr{stroke:#444;stroke-width:1.5;fill:none;marker-end:url(#a)}
  </style>
  <rect width="920" height="560" fill="#fff"/>

  <!-- Count-Min -->
  <text x="20" y="28" class="h">① Count-Min Sketch（计数草图）: “about how many times was item E seen?”</text>
  <rect x="20" y="70" width="110" height="44" rx="8" class="box"/>
  <text x="75" y="90" text-anchor="middle" class="b">item E</text>
  <text x="75" y="106" text-anchor="middle" class="s">+1 each event</text>
  <text x="150" y="62" class="s">d = 3 hash functions（3 个哈希）× w = 8 counters（每行 8 格）</text>

  <path d="M130,92 L150,92 L150,96 L178,96" class="arr"/>
  <path d="M150,92 L150,146 L178,146" class="arr"/>
  <path d="M150,146 L150,196 L178,196" class="arr"/>
  <text x="160" y="88" class="s">h1</text>
  <text x="156" y="140" class="s">h2</text>
  <text x="156" y="190" class="s">h3</text>

  <g>
    <rect x="180" y="80" width="56" height="32" class="cell"/><rect x="236" y="80" width="56" height="32" class="cell"/><rect x="292" y="80" width="56" height="32" class="hit"/><rect x="348" y="80" width="56" height="32" class="cell"/><rect x="404" y="80" width="56" height="32" class="cell"/><rect x="460" y="80" width="56" height="32" class="cell"/><rect x="516" y="80" width="56" height="32" class="cell"/><rect x="572" y="80" width="56" height="32" class="cell"/>
    <text x="208" y="101" text-anchor="middle" class="m">12</text><text x="264" y="101" text-anchor="middle" class="m">3</text><text x="320" y="101" text-anchor="middle" class="m" style="font-weight:600">712</text><text x="376" y="101" text-anchor="middle" class="m">40</text><text x="432" y="101" text-anchor="middle" class="m">8</text><text x="488" y="101" text-anchor="middle" class="m">95</text><text x="544" y="101" text-anchor="middle" class="m">0</text><text x="600" y="101" text-anchor="middle" class="m">27</text>
    <rect x="180" y="130" width="56" height="32" class="cell"/><rect x="236" y="130" width="56" height="32" class="cell"/><rect x="292" y="130" width="56" height="32" class="cell"/><rect x="348" y="130" width="56" height="32" class="cell"/><rect x="404" y="130" width="56" height="32" class="cell"/><rect x="460" y="130" width="56" height="32" class="cell"/><rect x="516" y="130" width="56" height="32" class="hit"/><rect x="572" y="130" width="56" height="32" class="cell"/>
    <text x="208" y="151" text-anchor="middle" class="m">61</text><text x="264" y="151" text-anchor="middle" class="m">0</text><text x="320" y="151" text-anchor="middle" class="m">19</text><text x="376" y="151" text-anchor="middle" class="m">4</text><text x="432" y="151" text-anchor="middle" class="m">33</text><text x="488" y="151" text-anchor="middle" class="m">7</text><text x="544" y="151" text-anchor="middle" class="m" style="font-weight:600">700</text><text x="600" y="151" text-anchor="middle" class="m">52</text>
    <rect x="180" y="180" width="56" height="32" class="cell"/><rect x="236" y="180" width="56" height="32" class="hit"/><rect x="292" y="180" width="56" height="32" class="cell"/><rect x="348" y="180" width="56" height="32" class="cell"/><rect x="404" y="180" width="56" height="32" class="cell"/><rect x="460" y="180" width="56" height="32" class="cell"/><rect x="516" y="180" width="56" height="32" class="cell"/><rect x="572" y="180" width="56" height="32" class="cell"/>
    <text x="208" y="201" text-anchor="middle" class="m">5</text><text x="264" y="201" text-anchor="middle" class="m" style="font-weight:600">731</text><text x="320" y="201" text-anchor="middle" class="m">16</text><text x="376" y="201" text-anchor="middle" class="m">90</text><text x="432" y="201" text-anchor="middle" class="m">2</text><text x="488" y="201" text-anchor="middle" class="m">44</text><text x="544" y="201" text-anchor="middle" class="m">11</text><text x="600" y="201" text-anchor="middle" class="m">38</text>
  </g>
  <path d="M628,146 L660,146" class="arr"/>
  <rect x="662" y="100" width="244" height="92" rx="8" class="ok"/>
  <text x="784" y="122" text-anchor="middle" class="b">estimate = min(712, 700, 731)</text>
  <text x="784" y="142" text-anchor="middle" class="b">= 700</text>
  <text x="784" y="162" text-anchor="middle" class="s">other items also hit these cells,</text>
  <text x="784" y="179" text-anchor="middle" class="s">so the min is closest（取最小值最接近真值）</text>
  <text x="20" y="240" class="s">• Never under-counts（只会多算，不会少算）. With probability ≥ 1 − δ the overcount is ≤ ε · N, where N = total events in the window（误差相对总量 N）.</text>
  <text x="20" y="260" class="s">• Size: w = ⌈e / ε⌉ columns, d = ⌈ln(1/δ)⌉ rows. Fixed memory no matter how many distinct items. It counts, but cannot list which items are hot.</text>

  <!-- Space-Saving -->
  <line x1="20" y1="282" x2="900" y2="282" style="stroke:#ddd"/>
  <text x="20" y="310" class="h">② Space-Saving（高频项算法）, k = 3 slots: “which items are hot?”</text>

  <text x="40" y="340" class="b">table is full（表满了）</text>
  <rect x="40" y="350" width="150" height="30" class="cell"/><text x="60" y="370" class="m">A</text><text x="170" y="370" text-anchor="end" class="m">9</text>
  <rect x="40" y="380" width="150" height="30" class="cell"/><text x="60" y="400" class="m">B</text><text x="170" y="400" text-anchor="end" class="m">5</text>
  <rect x="40" y="410" width="150" height="30" class="bad"/><text x="60" y="430" class="m">C</text><text x="170" y="430" text-anchor="end" class="m">2  ← min</text>

  <rect x="250" y="370" width="200" height="50" rx="8" class="box"/>
  <text x="350" y="390" text-anchor="middle" class="b">new item D arrives</text>
  <text x="350" y="408" text-anchor="middle" class="s">D 不在表里（not in table）</text>
  <path d="M190,395 L248,395" class="arr"/>
  <path d="M450,395 L508,395" class="arr"/>

  <text x="510" y="340" class="b">evict min, inherit its count（踢掉最小，继承计数）</text>
  <rect x="510" y="350" width="150" height="30" class="cell"/><text x="530" y="370" class="m">A</text><text x="640" y="370" text-anchor="end" class="m">9</text>
  <rect x="510" y="380" width="150" height="30" class="cell"/><text x="530" y="400" class="m">B</text><text x="640" y="400" text-anchor="end" class="m">5</text>
  <rect x="510" y="410" width="150" height="30" class="hit"/><text x="530" y="430" class="m">D</text><text x="640" y="430" text-anchor="end" class="m">3 = 2+1</text>
  <text x="680" y="400" class="s">error(D) ≤ 2</text>
  <text x="680" y="418" class="s">（多算的最多是被踢者的计数）</text>

  <text x="20" y="470" class="s">• Any item seen more than N / k times is guaranteed to be in the table（出现超过 N/k 次的一定在表里）; each count over-estimates by at most N / k.</text>
  <text x="20" y="490" class="s">• Item already in the table → just +1. Only k slots of memory. Real implementations use a “stream summary” list so eviction is O(1).</text>
  <text x="20" y="518" class="b">Together（一起用）: Space-Saving keeps the candidate list; Count-Min or exact counts rank them.</text>
  <text x="20" y="540" class="s">Trending lists can be approximate; billing cannot（热门榜可以近似；计费、结算类计数必须精确）.</text>
</svg>
