<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" font-family="-apple-system, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#444"/></marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#D0392B"/></marker>
  </defs>
  <style>
    .box{fill:#EAF1FD;stroke:#3B6FD8;stroke-width:1.5}
    .data{fill:#EAF7EE;stroke:#2E8B57;stroke-width:1.5}
    .ext{fill:#F3EEFC;stroke:#7B5CC4;stroke-width:1.5}
    .bad{fill:#FDECEA;stroke:#D0392B;stroke-width:1.5}
    .t{font-size:13px;fill:#1f2328}
    .b{font-size:13px;fill:#1f2328;font-weight:600}
    .s{font-size:11.5px;fill:#555}
    .h{font-size:14px;font-weight:600;fill:#1f2328}
    .arr{stroke:#444;stroke-width:1.5;fill:none;marker-end:url(#a)}
    .ra{stroke:#D0392B;stroke-width:1.5;fill:none;marker-end:url(#r);stroke-dasharray:5 4}
    .n{font-size:11.5px;fill:#3B6FD8;font-weight:600}
  </style>
  <rect width="880" height="440" fill="#fff"/>
  <text x="20" y="26" class="h">Async order processing: at-least-once delivery, so every side effect must be repeat-proof</text>

  <rect x="20" y="60" width="140" height="56" rx="8" class="box"/>
  <text x="90" y="84" text-anchor="middle" class="b">Checkout API</text>
  <text x="90" y="102" text-anchor="middle" class="s">returns fast</text>

  <rect x="230" y="60" width="170" height="56" rx="8" class="data"/>
  <text x="315" y="84" text-anchor="middle" class="b">Order intent + state</text>
  <text x="315" y="102" text-anchor="middle" class="s">DB, keyed by orderId</text>
  <path d="M160,88 L226,88" class="arr"/>
  <text x="168" y="80" class="n">1 write</text>

  <rect x="20" y="190" width="140" height="56" rx="8" class="box"/>
  <text x="90" y="214" text-anchor="middle" class="b">Queue</text>
  <text x="90" y="232" text-anchor="middle" class="s">may redeliver</text>
  <path d="M90,116 L90,186" class="arr"/>
  <text x="98" y="155" class="n">2 publish stable orderId</text>

  <rect x="290" y="190" width="160" height="56" rx="8" class="box"/>
  <text x="370" y="214" text-anchor="middle" class="b">Worker</text>
  <text x="370" y="232" text-anchor="middle" class="s">bounded retries</text>
  <path d="M160,218 L286,218" class="arr"/>
  <text x="180" y="210" class="n">3 deliver</text>

  <path d="M350,190 L330,120" class="arr"/>
  <text x="240" y="180" class="n">4 read next step</text>

  <rect x="560" y="190" width="200" height="56" rx="8" class="ext"/>
  <text x="660" y="212" text-anchor="middle" class="b">Payment provider</text>
  <text x="660" y="230" text-anchor="middle" class="s">honours idempotency key</text>
  <path d="M450,212 L556,212" class="arr"/>
  <text x="456" y="182" class="n">5 charge, key = paymentAttemptId</text>

  <path d="M410,190 L395,120" class="arr"/>
  <text x="405" y="150" class="n">6 record result</text>
  <path d="M290,240 L164,240" class="arr"/>
  <text x="180" y="258" class="n">7 ack ONLY after 6</text>

  <!-- crash -->
  <rect x="520" y="70" width="340" height="92" rx="8" class="bad"/>
  <text x="532" y="92" class="b" style="fill:#D0392B">Crash between 5 and 6</text>
  <text x="532" y="111" class="s">Provider charged, our DB doesn't know.</text>
  <text x="532" y="128" class="s">Redelivery must reuse the SAME paymentAttemptId,</text>
  <text x="532" y="145" class="s">or reconcile with the provider. New ID = double charge.</text>

  <!-- DLQ -->
  <rect x="20" y="320" width="140" height="56" rx="8" class="bad"/>
  <text x="90" y="344" text-anchor="middle" class="b">DLQ</text>
  <text x="90" y="362" text-anchor="middle" class="s">after N attempts</text>
  <path d="M90,246 L90,316" class="ra"/>

  <rect x="230" y="320" width="270" height="56" rx="8" class="box"/>
  <text x="365" y="342" text-anchor="middle" class="b">Inspect → fix or cancel</text>
  <text x="365" y="360" text-anchor="middle" class="s">intent + dedup record + provider result</text>
  <path d="M160,348 L226,348" class="arr"/>

  <rect x="570" y="320" width="190" height="56" rx="8" class="box"/>
  <text x="665" y="342" text-anchor="middle" class="b">Deliberate replay</text>
  <text x="665" y="360" text-anchor="middle" class="s">never bulk-dump back</text>
  <path d="M500,348 L566,348" class="arr"/>

  <text x="20" y="412" class="s">Prove it with 3 fault tests: ① publish the same orderId twice → 1 charge  ② kill worker between 5 and 6 → no 2nd charge  ③ poison message → DLQ, healthy orders keep flowing</text>
</svg>
