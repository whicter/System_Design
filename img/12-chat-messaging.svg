<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" font-family="-apple-system, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#444"/></marker>
  </defs>
  <style>
    .box{fill:#EAF1FD;stroke:#3B6FD8;stroke-width:1.5}
    .data{fill:#EAF7EE;stroke:#2E8B57;stroke-width:1.5}
    .ext{fill:#F3EEFC;stroke:#7B5CC4;stroke-width:1.5}
    .t{font-size:13px;fill:#1f2328}
    .b{font-size:13px;fill:#1f2328;font-weight:600}
    .s{font-size:11.5px;fill:#555}
    .n{font-size:11.5px;fill:#3B6FD8;font-weight:600}
    .h{font-size:14px;font-weight:600;fill:#1f2328}
    .arr{stroke:#444;stroke-width:1.5;fill:none;marker-end:url(#a)}
    .dash{stroke:#444;stroke-width:1.3;fill:none;marker-end:url(#a);stroke-dasharray:5 4}
  </style>
  <rect width="900" height="470" fill="#fff"/>
  <text x="20" y="26" class="h">Chat (WhatsApp-style): persistent connections + a registry that says which server holds each user</text>

  <rect x="20" y="60" width="110" height="50" rx="8" class="box"/>
  <text x="75" y="90" text-anchor="middle" class="b">User A</text>
  <rect x="20" y="300" width="110" height="50" rx="8" class="box"/>
  <text x="75" y="330" text-anchor="middle" class="b">User B</text>

  <rect x="200" y="56" width="160" height="58" rx="8" class="box"/>
  <text x="280" y="80" text-anchor="middle" class="b">WS server 1</text>
  <text x="280" y="98" text-anchor="middle" class="s">holds A's socket</text>
  <rect x="200" y="296" width="160" height="58" rx="8" class="box"/>
  <text x="280" y="320" text-anchor="middle" class="b">WS server 7</text>
  <text x="280" y="338" text-anchor="middle" class="s">holds B's socket</text>
  <path d="M130,85 L196,85" class="arr"/>
  <path d="M196,325 L134,325" class="arr"/>

  <rect x="200" y="176" width="160" height="58" rx="8" class="data"/>
  <text x="280" y="200" text-anchor="middle" class="b">Connection registry</text>
  <text x="280" y="218" text-anchor="middle" class="s">user → server (Redis)</text>
  <path d="M260,114 L260,172" class="arr"/>
  <text x="140" y="148" class="n">② where is B?</text>
  <path d="M335,114 Q410,205 335,292" class="arr"/>
  <text x="376" y="210" class="n">③ forward</text>

  <rect x="440" y="56" width="180" height="58" rx="8" class="box"/>
  <text x="530" y="80" text-anchor="middle" class="b">Message service</text>
  <text x="530" y="98" text-anchor="middle" class="s">assigns per-chat seq no.</text>
  <path d="M360,78 L436,78" class="arr"/>
  <text x="366" y="70" class="n">① store</text>
  <rect x="440" y="176" width="180" height="58" rx="8" class="data"/>
  <text x="530" y="200" text-anchor="middle" class="b">Message store</text>
  <text x="530" y="218" text-anchor="middle" class="s">partition by chat_id</text>
  <path d="M530,114 L530,172" class="arr"/>

  <rect x="440" y="296" width="180" height="58" rx="8" class="ext"/>
  <text x="530" y="320" text-anchor="middle" class="b">Push notification</text>
  <text x="530" y="338" text-anchor="middle" class="s">if B is offline</text>
  <path d="M530,234 L530,292" class="dash"/>
  <text x="540" y="268" class="s">offline → keep + push</text>

  <!-- groups & media -->
  <rect x="690" y="56" width="190" height="78" rx="8" class="ext"/>
  <text x="785" y="78" text-anchor="middle" class="b">Group fan-out</text>
  <text x="785" y="96" text-anchor="middle" class="s">topic per group → handler</text>
  <text x="785" y="112" text-anchor="middle" class="s">looks up members, delivers</text>
  <text x="785" y="126" text-anchor="middle" class="s">each like a 1:1 message</text>
  <path d="M620,85 L686,95" class="dash"/>
  <rect x="690" y="176" width="190" height="78" rx="8" class="data"/>
  <text x="785" y="198" text-anchor="middle" class="b">Media / asset service</text>
  <text x="785" y="216" text-anchor="middle" class="s">client encrypts → blob store</text>
  <text x="785" y="232" text-anchor="middle" class="s">hash dedup → returns media_id</text>
  <text x="785" y="246" text-anchor="middle" class="s">only the ID rides the socket</text>

  <!-- acks -->
  <rect x="20" y="380" width="860" height="74" rx="8" fill="#FFF8E1" stroke="#E0B000"/>
  <text x="34" y="402" class="b">Receipts:  ✓ sent (server stored it) → ✓✓ delivered (B's device acked) → read (B opened it)</text>
  <text x="34" y="422" class="s">At-least-once delivery + client dedup by message_id; order within a chat by sequence number, not wall clock.</text>
  <text x="34" y="440" class="s">Registry entries cached on each WS server with a short TTL; a reconnect to another server just overwrites the mapping.</text>
</svg>
