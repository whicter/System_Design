<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 420" font-family="-apple-system, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#444"/></marker>
  </defs>
  <style>
    .box{fill:#EAF1FD;stroke:#3B6FD8;stroke-width:1.5}
    .proc{fill:#FFF4E5;stroke:#E08A00;stroke-width:1.5}
    .data{fill:#EAF7EE;stroke:#2E8B57;stroke-width:1.5}
    .t{font-size:13px;fill:#1f2328}
    .b{font-size:13px;fill:#1f2328;font-weight:600}
    .s{font-size:11.5px;fill:#555}
    .h{font-size:14px;font-weight:600;fill:#1f2328}
    .arr{stroke:#444;stroke-width:1.5;fill:none;marker-end:url(#a)}
    .lane{fill:#FAFAFA;stroke:#ddd}
  </style>
  <rect width="880" height="420" fill="#fff"/>
  <text x="20" y="26" class="h">Video (YouTube): write path is a slow async pipeline; read path is almost all CDN</text>

  <rect x="10" y="40" width="860" height="150" rx="10" class="lane"/>
  <text x="24" y="60" class="b" style="fill:#B36B00">Upload (async, minutes OK)</text>
  <rect x="24" y="76" width="120" height="58" rx="8" class="box"/>
  <text x="84" y="100" text-anchor="middle" class="b">Uploader</text>
  <text x="84" y="118" text-anchor="middle" class="s">resumable chunks</text>
  <rect x="174" y="76" width="140" height="58" rx="8" class="data"/>
  <text x="244" y="100" text-anchor="middle" class="b">Upload storage</text>
  <text x="244" y="118" text-anchor="middle" class="s">raw, temporary</text>
  <rect x="344" y="76" width="170" height="58" rx="8" class="proc"/>
  <text x="429" y="100" text-anchor="middle" class="b">Transcode workers</text>
  <text x="429" y="118" text-anchor="middle" class="s">split → parallel encode</text>
  <rect x="544" y="76" width="150" height="58" rx="8" class="data"/>
  <text x="619" y="100" text-anchor="middle" class="b">Blob store</text>
  <text x="619" y="118" text-anchor="middle" class="s">2160p…240p segments</text>
  <rect x="724" y="76" width="136" height="58" rx="8" class="data"/>
  <text x="792" y="100" text-anchor="middle" class="b">Metadata DB</text>
  <text x="792" y="118" text-anchor="middle" class="s">status: READY</text>
  <path d="M144,105 L170,105" class="arr"/>
  <path d="M314,105 L340,105" class="arr"/>
  <path d="M514,105 L540,105" class="arr"/>
  <path d="M694,105 L720,105" class="arr"/>
  <text x="344" y="156" class="s">also: thumbnails, dedup (fingerprint), content checks</text>
  <text x="344" y="174" class="s">a queue between storage and workers absorbs upload bursts</text>

  <rect x="10" y="206" width="860" height="120" rx="10" class="lane"/>
  <text x="24" y="226" class="b" style="fill:#3B6FD8">Watch (latency-critical)</text>
  <rect x="24" y="242" width="150" height="58" rx="8" class="box"/>
  <text x="99" y="266" text-anchor="middle" class="b">Player</text>
  <text x="99" y="284" text-anchor="middle" class="s">adaptive bitrate</text>
  <rect x="214" y="242" width="170" height="58" rx="8" class="data"/>
  <text x="299" y="266" text-anchor="middle" class="b">CDN edge</text>
  <text x="299" y="284" text-anchor="middle" class="s">popular videos</text>
  <rect x="424" y="242" width="190" height="58" rx="8" class="data"/>
  <text x="519" y="266" text-anchor="middle" class="b">Regional / ISP cache</text>
  <text x="519" y="284" text-anchor="middle" class="s">moderately popular</text>
  <rect x="654" y="242" width="200" height="58" rx="8" class="data"/>
  <text x="754" y="266" text-anchor="middle" class="b">Origin blob store</text>
  <text x="754" y="284" text-anchor="middle" class="s">long tail</text>
  <path d="M174,271 L210,271" class="arr"/>
  <path d="M384,271 L420,271" class="arr"/>
  <path d="M614,271 L650,271" class="arr"/>
  <text x="214" y="318" class="s">miss → next tier; the player picks the next segment's quality from measured bandwidth</text>

  <text x="20" y="352" class="s"><tspan font-weight="600">Trade-offs to say:</tspan> eventual consistency for views/likes/feeds, strong for account data · public CDN for low-traffic regions,</text>
  <text x="20" y="370" class="s">private CDN once volume pays for it · dedup duplicate uploads (storage + copyright) · sharded MySQL behind a routing layer</text>
  <text x="20" y="388" class="s">(Vitess-style) instead of sharding logic in every app.</text>
  <text x="20" y="410" class="s"><tspan font-weight="600">Numbers that drive it:</tspan> egress bandwidth, not QPS, is the cost centre → cache-hit ratio at the edge is the key metric.</text>
</svg>
