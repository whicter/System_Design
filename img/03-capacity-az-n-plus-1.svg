<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 420" font-family="-apple-system, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif">
  <style>
    .t{font-size:13px;fill:#1f2328}
    .b{font-size:13px;fill:#1f2328;font-weight:600}
    .s{font-size:11.5px;fill:#555}
    .h{font-size:14px;font-weight:600;fill:#1f2328}
    .calc{fill:#F6F8FA;stroke:#bbb}
    .a{fill:#5B8DEF}
    .bz{fill:#F2A541}
    .cz{fill:#59B37B}
  </style>
  <rect width="860" height="420" fill="#fff"/>
  <text x="20" y="26" class="h">Sizing a stateless tier: "lose one instance" vs "lose one AZ" are different requirements</text>

  <!-- calc chain -->
  <rect x="20" y="44" width="820" height="64" rx="8" class="calc"/>
  <text x="34" y="68" class="t">Peak 120 RPS × 10 = <tspan font-weight="600">1,200 RPS</tspan>   →   tested 80 RPS/instance × 70% target = <tspan font-weight="600">56 RPS</tspan>   →   ceil(1,200/56) = 22</text>
  <text x="34" y="92" class="t">+20% surge headroom → <tspan font-weight="600">27 instances must be serving at peak</tspan>   (numbers are fictional; every number has a unit + source)</text>

  <!-- bars: scale 54 -> 540px => 10px per instance; x0=250 -->
  <text x="20" y="146" class="b">Base (no failure)</text>
  <text x="20" y="162" class="s">27 serving</text>
  <rect x="250" y="136" width="270" height="28" class="a"/>
  <text x="530" y="155" class="t">27</text>

  <text x="20" y="206" class="b">Instance N+1</text>
  <text x="20" y="222" class="s">survive 1 instance lost</text>
  <rect x="250" y="196" width="140" height="28" class="a"/>
  <rect x="390" y="196" width="140" height="28" class="bz"/>
  <text x="540" y="215" class="t">28 (14 + 14 across 2 AZs)</text>

  <text x="20" y="266" class="b">AZ N+1, 2 AZs</text>
  <text x="20" y="282" class="s">survivor carries everything</text>
  <rect x="250" y="256" width="270" height="28" class="a"/>
  <rect x="520" y="256" width="270" height="28" class="bz"/>
  <text x="800" y="275" class="t">54</text>
  <text x="385" y="275" text-anchor="middle" class="s" style="fill:#fff">AZ-A 27</text>
  <text x="655" y="275" text-anchor="middle" class="s" style="fill:#fff">AZ-B 27</text>

  <text x="20" y="326" class="b">AZ N+1, 3 AZs</text>
  <text x="20" y="342" class="s">2 survivors carry 27</text>
  <rect x="250" y="316" width="140" height="28" class="a"/>
  <rect x="390" y="316" width="140" height="28" class="bz"/>
  <rect x="530" y="316" width="140" height="28" class="cz"/>
  <text x="680" y="335" class="t">42 (14 per AZ ≈ 1.5×)</text>

  <text x="20" y="384" class="s">Then add: startup delay (image pull, init, health check, LB registration) → pre-warm or schedule scale-up before the peak.</text>
  <text x="20" y="404" class="s">And check quotas (cores, load balancers, IP pool, function concurrency) — autoscaling can stall while the code is healthy.</text>
</svg>
