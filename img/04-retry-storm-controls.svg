<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 420" font-family="-apple-system, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#D0392B"/></marker>
  </defs>
  <style>
    .bad{fill:#FDECEA;stroke:#D0392B;stroke-width:1.5}
    .ctl{fill:#EAF1FD;stroke:#3B6FD8;stroke-width:1.5}
    .t{font-size:13px;fill:#1f2328}
    .b{font-size:13px;fill:#1f2328;font-weight:600}
    .s{font-size:11.5px;fill:#555}
    .h{font-size:14px;font-weight:600;fill:#1f2328}
    .ra{stroke:#D0392B;stroke-width:1.8;fill:none;marker-end:url(#r)}
  </style>
  <rect width="860" height="420" fill="#fff"/>
  <text x="20" y="26" class="h">Why naive retries turn a slowdown into an outage — and the controls, in order</text>

  <!-- loop -->
  <text x="40" y="58" class="b" style="fill:#D0392B">Feedback loop</text>
  <rect x="120" y="72" width="190" height="46" rx="8" class="bad"/>
  <text x="215" y="100" text-anchor="middle" class="t">Dependency slows down</text>
  <rect x="230" y="168" width="170" height="46" rx="8" class="bad"/>
  <text x="315" y="196" text-anchor="middle" class="t">Callers hit timeouts</text>
  <rect x="120" y="264" width="190" height="46" rx="8" class="bad"/>
  <text x="215" y="292" text-anchor="middle" class="t">Callers retry immediately</text>
  <rect x="20" y="168" width="170" height="46" rx="8" class="bad"/>
  <text x="105" y="190" text-anchor="middle" class="t">More in-flight work</text>
  <text x="105" y="206" text-anchor="middle" class="s">threads, conns, queues</text>
  <path d="M290,118 Q330,140 320,164" class="ra"/>
  <path d="M320,214 Q320,250 296,262" class="ra"/>
  <path d="M140,264 Q100,250 100,218" class="ra"/>
  <path d="M100,168 Q100,120 136,118" class="ra"/>

  <rect x="20" y="330" width="390" height="70" rx="8" fill="#FFF8E1" stroke="#E0B000"/>
  <text x="32" y="352" class="b">A timeout is an UNKNOWN outcome, not a failure.</text>
  <text x="32" y="372" class="s">The payment may have succeeded after you stopped waiting.</text>
  <text x="32" y="389" class="s">Retry a side effect only with the same idempotency key.</text>

  <!-- controls -->
  <text x="450" y="58" class="b" style="fill:#3B6FD8">Controls (apply in this order)</text>
  <rect x="450" y="70" width="390" height="50" rx="8" class="ctl"/>
  <text x="464" y="91" class="b">① Timeout budget</text>
  <text x="464" y="109" class="s">fits inside the request's total deadline, leaves room to retry</text>
  <rect x="450" y="128" width="390" height="50" rx="8" class="ctl"/>
  <text x="464" y="149" class="b">② Bounded retries</text>
  <text x="464" y="167" class="s">attempt cap + total-time cap; never retry rejections / out-of-stock</text>
  <rect x="450" y="186" width="390" height="50" rx="8" class="ctl"/>
  <text x="464" y="207" class="b">③ Exponential backoff + jitter</text>
  <text x="464" y="225" class="s">spread retries so callers don't come back together</text>
  <rect x="450" y="244" width="390" height="50" rx="8" class="ctl"/>
  <text x="464" y="265" class="b">④ Circuit breaker per dependency</text>
  <text x="464" y="283" class="s">inventory down ≠ trip the payment breaker</text>
  <rect x="450" y="302" width="390" height="50" rx="8" class="ctl"/>
  <text x="464" y="323" class="b">⑤ Throttling / load shedding</text>
  <text x="464" y="341" class="s">at the edge, inside the service, before the dependency</text>
  <text x="450" y="378" class="s">Retry logic lives in the CALLER: only it knows the remaining deadline</text>
  <text x="450" y="395" class="s">and whether the operation is idempotent. Gateways can't infer that.</text>
</svg>
