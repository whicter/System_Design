<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" font-family="-apple-system, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#444"/></marker>
  </defs>
  <style>
    .box{fill:#EAF1FD;stroke:#3B6FD8;stroke-width:1.5}
    .st{fill:#fff;stroke:#444;stroke-width:1.5}
    .hold{fill:#FFF4E5;stroke:#E08A00;stroke-width:1.5}
    .done{fill:#EAF7EE;stroke:#2E8B57;stroke-width:1.5}
    .t{font-size:13px;fill:#1f2328}
    .b{font-size:13px;fill:#1f2328;font-weight:600}
    .s{font-size:11.5px;fill:#555}
    .n{font-size:11.5px;fill:#3B6FD8;font-weight:600}
    .h{font-size:14px;font-weight:600;fill:#1f2328}
    .arr{stroke:#444;stroke-width:1.5;fill:none;marker-end:url(#a)}
    .tbl{fill:#F6F8FA;stroke:#ccc}
  </style>
  <rect width="880" height="440" fill="#fff"/>
  <text x="20" y="26" class="h">Ticketing: shave the spike at the door, then make "two people, one seat" impossible</text>

  <!-- waiting room -->
  <rect x="20" y="50" width="150" height="60" rx="8" class="box"/>
  <text x="95" y="74" text-anchor="middle" class="b">Millions arrive</text>
  <text x="95" y="92" text-anchor="middle" class="s">on-sale moment</text>
  <rect x="210" y="50" width="170" height="60" rx="8" class="hold"/>
  <text x="295" y="74" text-anchor="middle" class="b">Virtual waiting room</text>
  <text x="295" y="92" text-anchor="middle" class="s">tokens released at a rate</text>
  <path d="M170,80 L206,80" class="arr"/>
  <path d="M380,80 L420,80" class="arr"/>
  <text x="430" y="74" class="s">only admitted users</text>
  <text x="430" y="90" class="s">reach seat selection</text>

  <!-- state machine -->
  <text x="20" y="150" class="h">Seat state machine</text>
  <rect x="40" y="170" width="140" height="56" rx="28" class="st"/>
  <text x="110" y="203" text-anchor="middle" class="b">AVAILABLE</text>
  <rect x="300" y="170" width="160" height="56" rx="28" class="hold"/>
  <text x="380" y="194" text-anchor="middle" class="b">HELD</text>
  <text x="380" y="212" text-anchor="middle" class="s">user_id, expires_at</text>
  <rect x="590" y="170" width="140" height="56" rx="28" class="done"/>
  <text x="660" y="203" text-anchor="middle" class="b">BOOKED</text>
  <path d="M180,190 L296,190" class="arr"/>
  <text x="190" y="182" class="n">conditional update</text>
  <path d="M460,198 L586,198" class="arr"/>
  <text x="472" y="190" class="n">payment succeeded</text>
  <path d="M300,214 Q240,250 184,214" class="arr"/>
  <text x="200" y="262" class="s">TTL expired / payment failed</text>
  <text x="200" y="278" class="s">→ release (saga compensation)</text>
  <text x="600" y="246" class="s">idempotent: same order key</text>
  <text x="600" y="262" class="s">→ same booking</text>

  <!-- lock table -->
  <rect x="20" y="300" width="840" height="124" rx="8" class="tbl"/>
  <text x="34" y="322" class="b">How the AVAILABLE → HELD step stays exclusive</text>
  <text x="34" y="346" class="s"><tspan font-weight="600">Optimistic (version / conditional UPDATE … WHERE status='AVAILABLE')</tspan>: no blocking; many losers retry when the seat is hot.</text>
  <text x="34" y="368" class="s"><tspan font-weight="600">Pessimistic (row lock / SELECT … FOR UPDATE)</tspan>: no conflicts, but requests queue on the same row → lower throughput.</text>
  <text x="34" y="390" class="s"><tspan font-weight="600">Distributed lock (Redis / ZooKeeper)</tspan>: works across shards/services; extra moving part, needs lease + fencing token.</text>
  <text x="34" y="412" class="s">Default answer: conditional update in the DB that owns the seat; waiting room keeps contention bounded.</text>
</svg>
